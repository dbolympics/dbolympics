# Querybrew on ClickHouse: Umbra writes every query for ClickHouse, and ClickHouse runs what
# Umbra wrote. Two databases hold the data: Umbra (the experimental build of Umbra's public image,
# as systems/umbra), whose optimizer works with the statistics of the loaded data, and
# ClickHouse (installed in the system's own container, as systems/clickhouse). The
# query program hides the two:
# - DDL and loads run in both, Umbra first.
# - A query goes to Umbra as `EXPLAIN (FORMAT SQL, DIALECT clickhouse)`, and the text it returns
#   runs in ClickHouse. The time is the runner's: Umbra's writing and ClickHouse's run.
# So the schema, the load statement and the queries below are Umbra's; the query program makes
# ClickHouse's DDL and load from them.
name = "clickhouse_brew"
# runs on ClickHouse (docs/RUNNER.md): the website shows it under ClickHouse, when ClickHouse is opened
based_on = "clickhouse"
# the version, kept with the results (by hand)
version = "experimental (ClickHouse 26.9.22.3)"
# for Umbra, which does not read list columns from Parquet; ClickHouse reads the original files
arrays = "text"


# how the website shows it
[site]
name = "clickhouse_brew"
long_name = "Querybrew on ClickHouse"
description = "Umbra writes every query for ClickHouse, which runs it"

[load]
statement = "COPY {table} FROM '{file}' WITH (FORMAT parquet)"

[dialect]
# Umbra's session, before it writes a query: date - date is the number of days, as in the
# standard (otherwise an interval in Umbra); no sideways information passing, which executes small
# scans early while planning and would put results that Umbra computed into the query it writes
settings = ["SET debug.semana.pgdatesub = true", "SET debug.optimizer.sidewayinformationpassing = false"]

[dialect.functions]
# no DISTINCT in window aggregates: the distinct non-NULL values from two dense ranks
"count_distinct_over(x, window)" = "(DENSE_RANK() OVER ({window} ORDER BY {x} ASC NULLS FIRST) + DENSE_RANK() OVER ({window} ORDER BY {x} DESC NULLS LAST) - 1 - MAX(CASE WHEN {x} IS NULL THEN 1 ELSE 0 END) OVER ({window}))"

[[container]]
name = "umbra"
image = "docker.io/umbradb/umbra:experimental"
# Umbra only writes the queries; it has a memory limit of its own (as every container), and its
# buffers, which hold the loaded data, get all of it (as systems/umbra).
# PGHOST: its socket in /run/dbo, where the query program connects
env = { PARALLEL = "{threads}", MEMORY = "{memory_mb}M", PGHOST = "/run/dbo" }
ulimits = ["nofile=524288:524288"]
