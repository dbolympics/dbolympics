# Hardcharger on the Parquet files where they are: every table is a view over its files so far,
# nothing is loaded. The system and the rest of its system file are Hardcharger's (../hardcharger):
# the same server and ADBC driver.
name = "hardcharger-parquet"
base = "hardcharger"
# runs on DuckDB (docs/RUNNER.md): the website shows it under DuckDB, when DuckDB is opened
based_on = "duckdb-parquet"
keys = ["none"]
category = "parquet"

# how the website shows it
[site]
name = "Hardcharger"
description = "Hardcharger Engine (derived from DuckDB) behind a Chargewire server, queried through its ADBC driver, on the Parquet files in place"

[load]
statement = "CREATE OR REPLACE VIEW {table} AS SELECT * FROM read_parquet([{files}])"

[dialect]
# as Hardcharger's, and the Parquet files' metadata kept between queries, as duckdb-parquet does
# (the engine reads it at every query by default)
settings = ["SET threads = {threads}", "SET memory_limit = '{memory_mb%80}MiB'", "SET integer_division = true", "SET parquet_metadata_cache = true"]
