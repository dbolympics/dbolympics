# Hardcharger: Hardcharger Engine, derived from DuckDB and modified for performance, served over
# Chargewire, queried through the Hardcharger ADBC driver.
name = "hardcharger"
# runs on DuckDB (docs/RUNNER.md): the website shows it under DuckDB, when DuckDB is opened
based_on = "duckdb"
# as in install (HARDCHARGER_VERSION, ADBC_VERSION)
version = "2.14.0 (Hardcharger Engine 2.0.1, derived from DuckDB 2.0.1; ADBC driver 2.7.2)"

# how the website shows it
[site]
name = "Hardcharger"
description = "Hardcharger Engine (derived from DuckDB) behind a Chargewire server, queried through its ADBC driver"

[load]
statement = "COPY {table} FROM '{file}' (FORMAT parquet)"

[dialect]
# Same resource limits and integer division semantics as the DuckDB entry.
settings = ["SET threads = {threads}", "SET memory_limit = '{memory_mb%80}MiB'", "SET integer_division = true"]

[dialect.functions]
"date_diff_days(a, b)" = "DATE_DIFF('day', {a}, {b})"
"year_month(x)" = "strftime({x}, '%Y-%m')"
