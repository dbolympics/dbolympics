# Hardcharger: DuckDB served over Chargewire, queried by the released hardcharger CLI.
name = "hardcharger"
# runs on DuckDB (docs/RUNNER.md): the website shows it under DuckDB, when DuckDB is opened
based_on = "duckdb"
version = "2.4.1 (DuckDB 2.0.0)"

# how the website shows it
[site]
name = "Hardcharger"
description = "DuckDB behind a Chargewire server, queried through its CLI"

[load]
statement = "COPY {table} FROM '{file}' (FORMAT parquet)"

[dialect]
# Same resource limits and integer division semantics as the DuckDB entry.
settings = ["SET threads = {threads}", "SET memory_limit = '{memory_mb%80}MiB'", "SET integer_division = true"]

[dialect.functions]
"date_diff_days(a, b)" = "DATE_DIFF('day', {a}, {b})"
"year_month(x)" = "strftime({x}, '%Y-%m')"
