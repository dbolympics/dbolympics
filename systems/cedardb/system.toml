# CedarDB, from its image, in a container next to the system's own.
name = "cedardb"
# the version, kept with the results (by hand)
version = "v2026-10-08"
arrays = "text"


# how the website shows it
[site]
name = "CedarDB"
description = "its own server"

[load]
statement = "COPY {table} FROM '{file}' (FORMAT parquet)"

[dialect.functions]
# to_char takes a timestamp, not a date
"year_month(x)" = "to_char(CAST({x} AS timestamp), 'YYYY-MM')"
# no DISTINCT in window aggregates: the distinct non-NULL values from two dense ranks
"count_distinct_over(x, window)" = "(DENSE_RANK() OVER ({window} ORDER BY {x} ASC NULLS FIRST) + DENSE_RANK() OVER ({window} ORDER BY {x} DESC NULLS LAST) - 1 - MAX(CASE WHEN {x} IS NULL THEN 1 ELSE 0 END) OVER ({window}))"

[[container]]
name = "db"
image = "docker.io/cedardb/cedardb:v2026-10-08"
# CedarDB sizes itself for the container: as many threads as its cores, and 45% of its memory limit
# each for its buffers and its queries.
env = { CEDAR_PASSWORD = "Dbolympics-Bench-2026!" }
secrets = { LICENSE_KEY = "CEDARDB_LICENSE_KEY" }
ulimits = ["nofile=524288:524288"]
