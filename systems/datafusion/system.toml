# Apache DataFusion, embedded in the query program (Rust, query/), which lives for the whole run.
# DataFusion has no storage of its own: it queries the Parquet files where they are, every table an
# external table over the directory with a link to each of its files so far, made again at every load.
name = "datafusion"
# the version, kept with the results (by hand)
version = "55.0.0"
keys = ["none"]
category = "parquet"


[load]
statement = ["DROP TABLE IF EXISTS {table}", "CREATE EXTERNAL TABLE {table} STORED AS PARQUET LOCATION '{dir}/'"]

[dialect.types]
uuid = "varchar"
json = "varchar"
"array(element)" = "{element}[]"

[dialect.functions]
# DataFusion has no FETCH FIRST
"fetch_first(n)" = "LIMIT {n}"
"year_month(x)" = "to_char({x}, '%Y-%m')"
