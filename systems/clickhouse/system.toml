# ClickHouse, installed in the system's own container (as in ClickBench).
name = "clickhouse"
# the version, kept with the results (by hand)
version = "26.9.22.3"


[load]
statement = "INSERT INTO {table} SELECT * FROM file('{file}', Parquet)"

[ddl]
suffix = "ENGINE = MergeTree"
suffix_without_keys = "ENGINE = MergeTree ORDER BY tuple()"

[dialect.types]
date = "Date32"
timestamp = "DateTime64(6)"
json = "String"
uuid = "UUID"
"varchar(length)" = "String"
"array(element)" = "Array({element})"

[dialect.functions]
# whole days: the microseconds between the two, divided toward zero (as the day field of the difference)
"whole_days_between(a, b)" = "intDiv(dateDiff('microsecond', {a}, {b}), 86400000000)"
# membership with the standard's NULLs: NULL when x is NULL or there is no match but a NULL element
"equals_any(x, arr)" = "CASE WHEN {arr} IS NULL THEN NULL WHEN empty({arr}) THEN false WHEN {x} IS NULL THEN NULL WHEN has({arr}, {x}) THEN true WHEN has({arr}, NULL) THEN NULL ELSE false END"
# no integer times an interval
"add_minutes(ts, n)" = "addMinutes({ts}, {n})"
"date_diff_days(a, b)" = "dateDiff('day', {a}, {b})"
"year_month(x)" = "formatDateTime({x}, '%Y-%m')"
# date_trunc of a month or quarter returns a date; the standard's result is a timestamp
"date_trunc(unit, x)" = "CAST(date_trunc({unit}, {x}) AS DateTime64(6))"
# max of a boolean is true when any value is true; NULLs are skipped, as by BOOL_OR
"bool_or(x)" = "max({x})"
# PERCENTILE_CONT's linear interpolation between the closest values; on doubles, as PERCENTILE_CONT
# returns (the function takes no decimals)
"percentile_cont(p, x)" = "quantileExactInclusive({p})(toFloat64({x}))"
# the difference of two timestamps keeps no fractions of a second; microseconds do
"seconds_between(a, b)" = "CAST(divideDecimal(toDecimal128(dateDiff('microsecond', {a}, {b}), 0), toDecimal128(1000000, 0), 6) AS Nullable(Decimal(18, 6)))"
"percentile_cont_filter(p, x, condition)" = "quantileExactInclusiveIf({p})(toFloat64({x}), {condition})"
# binary order, as the benchmark's collation; NULLs are skipped, as by STRING_AGG
"string_agg_sorted(x, sep)" = "arrayStringConcat(arraySort(groupArray({x})), {sep})"
"string_agg_distinct_sorted(x, sep)" = "arrayStringConcat(arraySort(groupUniqArray({x})), {sep})"
