# CedarDB on the Parquet files where they are: every table is a view over its files so far, nothing
# is loaded. The system and the rest of its system file are CedarDB's (../cedardb).
name = "cedardb-parquet"
base = "cedardb"
keys = ["none"]
category = "parquet"

# how the website shows it
[site]
name = "CedarDB"
description = "its own server, queries the Parquet files in place"

[load]
statement = "CREATE OR REPLACE VIEW {table} AS SELECT * FROM '{dir}/*.parquet'"
