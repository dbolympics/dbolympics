# the query program (query.rs), built by install
[package]
name = "query"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "query"
path = "query.rs"

[dependencies]
# the runner's protocol, shared by every query program
dbo = { path = "../dbo" }
# links the libduckdb that install puts in /usr/local/lib (DUCKDB_LIB_DIR)
duckdb = "=1.20000.0"
arrow-csv = "60"

# not a member of the repository's workspace
[workspace]
